<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Biology Bowl Practice</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .hidden { display: none; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; margin: 5px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-reveal { background: #e67e22; color: white; }
        .btn-back { background: #95a5a6; color: white; }
        .option { display: block; background: #ecf0f1; padding: 10px; margin: 8px 0; border-radius: 5px; cursor: pointer; }
        .option:hover { background: #dcdde1; }
        .selection-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        #result-msg { font-weight: bold; margin-top: 15px; }
        .score-display { font-size: 1.5em; color: #27ae60; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Biology Bowl Study Tool</h1>
    
    <!-- Step 1: Setup Area (The Input) -->
    <div id="setup">
        <div class="selection-group">
            <label for="unit-select">Choose a Study Unit:</label>
            <select id="unit-select" style="width: 100%; padding: 10px;">
                <option value="unit_1_natureoflife.json">Unit 1: Nature of Life</option>
                <option value="unit_2_ecology.json">Unit 2: Ecology</option>
                <option value="unit_3_cells.json">Unit 3: Cells</option>
                <option value="unit_4_genetics.json">Unit 4: Genetics</option>
                <option value="unit_5_evolution.json">Unit 5: Evolution</option>
                <option value="unit_6_microorgtoplants.json">Unit 6: Microorganisms to Plants</option>
                <option value="unit_7_animals.json">Unit 7: Animals</option>
                <option value="unit_8_humanbody.json">Unit 8: Human Body</option>
            </select>
        </div>

        <!-- NEW: Length Selection (The Stimulus) -->
        <div class="selection-group">
            <label for="length-select">Quiz Length:</label>
            <select id="length-select" style="width: 100%; padding: 10px;">
                <option value="short">Short (Standard)</option>
                <option value="long">Long (50 Questions)</option>
            </select>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="loadQuiz()">Start Practice</button>
    </div>

    <!-- Step 2: Quiz Area (The Process) -->
    <div id="quiz-area" class="hidden">
        <h3 id="subject-header" style="color: #7f8c8d;"></h3>
        <div id="question-container">
            <p id="question-text" style="font-size: 1.2em;"></p>
            <div id="answer-options"></div>
        </div>
        
        <div id="navigation" style="margin-top: 20px;">
            <button class="btn btn-back" id="back-btn" onclick="changeQuestion(-1)">Back</button>
            <button class="btn btn-primary" id="next-btn" onclick="changeQuestion(1)">Next</button>
            <button class="btn btn-reveal" onclick="revealAnswer()">Reveal</button>
            <button class="btn btn-primary hidden" id="submit-btn" onclick="showScore()">Submit Test</button>
        </div>
        <p id="reveal-area" class="hidden" style="margin-top:15px; padding:10px; background:#f9ebea; border-left:5px solid #c0392b;"></p>
    </div>

    <!-- Step 3: Score Screen (The Conclusion) -->
    <div id="score-screen" class="hidden">
        <h2>Practice Complete!</h2>
        <p class="score-display" id="final-score"></p>
        <button class="btn btn-primary" onclick="location.reload()">Try Another Unit</button>
    </div>
</div>

<script>
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = {};

    async function loadQuiz() {
        let fileName = document.getElementById('unit-select').value;
        const lengthPref = document.getElementById('length-select').value;
        
        // If 'long' is selected, append '_50' to the filename (before the .json)
        if (lengthPref === 'long') {
            fileName = fileName.replace('.json', '_50.json');
        }

        const baseUrl = "https://raw.githubusercontent.com/stokkangri/middle_school_quiz/main/biology/sixth/";
        
        try {
            // "Transcription": Fetching the raw genetic information (JSON)
            const response = await fetch(baseUrl + fileName);
            if (!response.ok) throw new Error("Could not find the requested file.");
            
            const data = await response.json();
            const unitKey = Object.keys(data);
            
            currentQuestions = [];
            data[unitKey].forEach(section => {
                section.questions.forEach(q => {
                    q.subject = section.subject;
                    currentQuestions.push(q);
                });
            });

            // Randomize the "gene pool" for this attempt
            currentQuestions.sort(() => Math.random() - 0.5);

            document.getElementById('setup').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            displayQuestion();
        } catch (e) {
            alert("Error: " + e.message + "\nEnsure you have uploaded the _50.json version to your GitHub.");
        }
    }

    function displayQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('subject-header').innerText = q.subject;
        document.getElementById('question-text').innerText = `Q${currentIndex + 1}: ${q.question}`;
        document.getElementById('reveal-area').classList.add('hidden');
        
        const optionsDiv = document.getElementById('answer-options');
        optionsDiv.innerHTML = "";

        if (q.type === "multiple_choice") {
            q.options.forEach(opt => {
                const label = document.createElement('label');
                label.className = "option";
                const checked = userAnswers[currentIndex] === opt ? "checked" : "";
                label.innerHTML = `<input type="radio" name="quiz-opt" value="${opt}" ${checked} onchange="saveAnswer('${opt}')"> ${opt}`;
                optionsDiv.appendChild(label);
            });
        } else {
            const val = userAnswers[currentIndex] || "";
            optionsDiv.innerHTML = `<input type="text" id="sa-input" style="width:95%; padding:10px;" placeholder="Type your answer here..." value="${val}" oninput="saveAnswer(this.value)">`;
        }

        document.getElementById('back-btn').disabled = (currentIndex === 0);
        const isLast = currentIndex === currentQuestions.length - 1;
        document.getElementById('next-btn').classList.toggle('hidden', isLast);
        document.getElementById('submit-btn').classList.toggle('hidden', !isLast);
    }

    function saveAnswer(val) {
        userAnswers[currentIndex] = val;
    }

    function changeQuestion(step) {
        currentIndex += step;
        displayQuestion();
    }

    function revealAnswer() {
        const q = currentQuestions[currentIndex];
        const area = document.getElementById('reveal-area');
        area.innerHTML = `<strong>Correct Answer:</strong> ${q.answer}`;
        area.classList.remove('hidden');
    }

    function showScore() {
        let score = 0;
        currentQuestions.forEach((q, i) => {
            if (userAnswers[i] && userAnswers[i].toLowerCase().trim() === q.answer.toLowerCase().trim()) {
                score++;
            }
        });

        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `Your Score: ${score} / ${currentQuestions.length}`;
    }
</script>
</body>
</html>    <button onclick="startQuiz()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
        Start Quiz
    </button>
    </div>

    <div id="quiz-area" class="hidden">
        <h2 id="subject-title"></h2>
        <div id="question-box">
            <p id="question-text"></p>
            <div id="answer-input"></div>
        </div>
        
        <div id="controls">
            <button class="btn" id="back-btn" onclick="move(-1)">Back</button>
            <button class="btn" id="next-btn" onclick="move(1)">Next</button>
            <button class="btn btn-reveal" onclick="reveal()">Reveal</button>
            <button class="btn" id="submit-btn" onclick="submitQuiz()">Submit Test</button>
        </div>
        <p id="reveal-text" class="hidden" style="color: #c0392b; font-weight: bold;"></p>
    </div>

    <div id="score-screen" class="hidden">
        <h2>Practice Complete!</h2>
        <p id="results"></p>
        <button class="btn" onclick="location.reload()">Restart</button>
    </div>
</div>

<script>
    let quizData = [];
    let currentIdx = 0;
    let score = 0;
    let userAnswers = [];

    async function startQuiz() {
        // Determine the user's choice (The Stimulus)
        const selectedFile = document.getElementById('unit-select').value;
        
        // Construct the Raw URL (Information from conversation history)
        const rawBaseUrl = "https://raw.githubusercontent.com/stokkangri/middle_school_quiz/main/biology/sixth/";
        const finalUrl = rawBaseUrl + selectedFile;

        try {
            // Step 2: "Transcription" - Copying the master plan into a working blueprint
            const response = await fetch(finalUrl);
            if (!response.ok) throw new Error("Network error");
            const data = await response.json();

            // Standardize the data format
            const unitKey = Object.keys(data);
            quizData = [];
            data[unitKey].forEach(section => {
                section.questions.forEach(q => {
                    q.subject = section.subject;
                    quizData.push(q);
                });
            });

            // Randomize the "Gene Pool"
            quizData.sort(() => Math.random() - 0.5);

            // Step 3: Transition the UI (The Response)
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');
            renderQuestion();
            
        } catch (err) {
            alert("Error loading the unit: " + err.message);
        }
    }

    function renderQuestion() {
        const q = quizData[currentIdx];
        document.getElementById('subject-title').innerText = q.subject;
        document.getElementById('question-text').innerText = `Q${currentIdx + 1}: ${q.question}`;
        document.getElementById('reveal-text').classList.add('hidden');
        
        const inputArea = document.getElementById('answer-input');
        inputArea.innerHTML = '';

        if (q.type === 'multiple_choice') {
            q.options.forEach(opt => {
                const label = document.createElement('label');
                label.className = 'option';
                label.innerHTML = `<input type="radio" name="choice" value="${opt}"> ${opt}`;
                inputArea.appendChild(label);
            });
        } else {
            inputArea.innerHTML = `<input type="text" id="sa-input" style="width: 100%; padding: 8px;" placeholder="Type your answer here...">`;
        }
        
        document.getElementById('back-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').style.display = currentIdx === quizData.length - 1 ? 'none' : 'inline-block';
        document.getElementById('submit-btn').style.display = currentIdx === quizData.length - 1 ? 'inline-block' : 'none';
    }

    function move(dir) {
        saveAnswer();
        currentIdx += dir;
        renderQuestion();
    }

    function saveAnswer() {
        const q = quizData[currentIdx];
        if (q.type === 'multiple_choice') {
            const selected = document.querySelector('input[name="choice"]:checked');
            userAnswers[currentIdx] = selected ? selected.value : null;
        } else {
            const val = document.getElementById('sa-input').value;
            userAnswers[currentIdx] = val ? val.trim() : null;
        }
    }

    function reveal() {
        const q = quizData[currentIdx];
        const revealEl = document.getElementById('reveal-text');
        revealEl.innerText = `Correct Answer: ${q.answer}`;
        revealEl.classList.remove('hidden');
    }

    function submitQuiz() {
        saveAnswer();
        score = 0;
        quizData.forEach((q, i) => {
            if (userAnswers[i] && userAnswers[i].toLowerCase() === q.answer.toLowerCase()) {
                score++;
            }
        });
        document.getElementById('quiz-area').classList.add('hidden');
        document.getElementById('score-screen').classList.remove('hidden');
        document.getElementById('results').innerText = `Your Score: ${score} / ${quizData.length}`;
    }
</script>
</body>
</html>
