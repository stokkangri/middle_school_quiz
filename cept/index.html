<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Practice Quiz Portal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 24px;
            color: #0f172a;
        }

        .dropdown-container {
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: white;
            cursor: pointer;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            border: none;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .quiz-box {
            display: none;
        }

        .progress {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 10px;
            text-align: right;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .option-label:hover {
            background-color: #f1f5f9;
        }

        .option-label input {
            margin-right: 12px;
        }

        .feedback {
            margin-top: 15px;
            padding: 14px;
            border-radius: 8px;
            font-weight: 500;
            display: none;
        }

        .feedback.correct { display: block; background-color: #dcfce7; color: var(--success-color); border: 1px solid #bbf7d0; }
        .feedback.incorrect { display: block; background-color: #fee2e2; color: var(--error-color); border: 1px solid #fecaca; }

        .explanation {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #475569;
            background: #f8fafc;
            padding: 12px;
            border-left: 4px solid var(--primary-color);
            border-radius: 0 4px 4px 0;
            display: none;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .score-view { text-align: center; display: none; }
        #loading-message { text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Exam Practice Portal</h1>

    <div id="loading-message">Loading chapters layout...</div>

    <div id="setup-view" style="display: none;">
        <div class="dropdown-container">
            <label for="topic-select">Select Practice Topic:</label>
            <select id="topic-select"></select>
        </div>
        <button id="start-btn">Load Quiz Questions</button>
    </div>

    <div id="quiz-view" class="quiz-box">
        <div class="progress">Question <span id="current-idx">1</span> of <span id="total-count">0</span></div>
        <div id="question-container">
            <div class="question-text" id="q-text"></div>
            <div class="options" id="q-options"></div>
        </div>

        <div class="feedback" id="feedback-box"></div>
        <div class="explanation" id="explanation-box"></div>

        <div class="action-buttons">
            <button id="check-btn">Check Answer</button>
            <button id="reveal-btn" style="background-color: #64748b;">Reveal Answer</button>
            <button id="next-btn" style="display:none; background-color: var(--success-color);">Next Question</button>
        </div>
    </div>

    <div id="score-view" class="score-view">
        <h2>Topic Run Complete!</h2>
        <p style="font-size: 1.2rem;">Final Score: <strong id="final-score">0</strong> / <strong id="final-total">0</strong></p>
        <button id="restart-btn">Return to Menu</button>
    </div>
</div>

<script>
    let chapterIndex = [];
    let activeQuestions = [];
    let currentQuestionIndex = 0;
    let totalScore = 0;

    const loadingMessage = document.getElementById('loading-message');
    const startBtn = document.getElementById('start-btn');
    const topicSelect = document.getElementById('topic-select');
    const setupView = document.getElementById('setup-view');
    const quizView = document.getElementById('quiz-view');
    const scoreView = document.getElementById('score-view');
    
    const currentIdxText = document.getElementById('current-idx');
    const totalCountText = document.getElementById('total-count');
    const qText = document.getElementById('q-text');
    const qOptions = document.getElementById('q-options');
    
    const feedbackBox = document.getElementById('feedback-box');
    const explanationBox = document.getElementById('explanation-box');
    const checkBtn = document.getElementById('check-btn');
    const revealBtn = document.getElementById('reveal-btn');
    const nextBtn = document.getElementById('next-btn');
    
    const finalScoreText = document.getElementById('final-score');
    const finalTotalText = document.getElementById('final-total');
    const restartBtn = document.getElementById('restart-btn');

    // On setup load, initialize the global menu list configuration
    window.addEventListener('DOMContentLoaded', () => {
        fetch('chapters.json')
            .then(res => { if (!res.ok) throw new Error(); return res.json(); })
            .then(data => {
                chapterIndex = data;
                data.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.file;
                    opt.textContent = item.name;
                    topicSelect.appendChild(opt);
                });
                loadingMessage.style.display = 'none';
                setupView.style.display = 'block';
            })
            .catch(() => {
                loadingMessage.textContent = 'Error parsing primary chapters index.';
            });
    });

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[arr[j] ? j : i]] = [arr[j], arr[i]];
        }
    }

    startBtn.addEventListener('click', () => {
        const targetJsonFile = topicSelect.value;
        setupView.style.display = 'none';
        loadingMessage.textContent = 'Fetching single chapter data branch from file pool...';
        loadingMessage.style.display = 'block';

        // Lazy load the chosen file partition
        fetch(targetJsonFile)
            .then(res => { if (!res.ok) throw new Error(); return res.json(); })
            .then(questions => {
                activeQuestions = questions;
                shuffleArray(activeQuestions);
                
                currentQuestionIndex = 0;
                totalScore = 0;
                loadingMessage.style.display = 'none';
                quizView.style.display = 'block';
                loadQuestion();
            })
            .catch(() => {
                loadingMessage.textContent = 'Could not load the requested target JSON content block.';
            });
    });

    function loadQuestion() {
        feedbackBox.style.display = 'none';
        explanationBox.style.display = 'none';
        nextBtn.style.display = 'none';
        checkBtn.style.display = 'block';
        revealBtn.style.display = 'block';

        totalCountText.textContent = activeQuestions.length;
        currentIdxText.textContent = currentQuestionIndex + 1;

        const targetQ = activeQuestions[currentQuestionIndex];
        qText.textContent = targetQ.q;
        
        qOptions.innerHTML = '';
        Object.keys(targetQ.options).forEach(key => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.innerHTML = `<input type="radio" name="quiz-option" value="${key}"> <strong>${key})</strong> ${targetQ.options[key]}`;
            qOptions.appendChild(label);
        });
    }

    checkBtn.addEventListener('click', () => {
        const selected = document.querySelector('input[name="quiz-option"]:checked');
        if (!selected) { alert('Select an answer block first!'); return; }

        const currentQ = activeQuestions[currentQuestionIndex];
        if (selected.value === currentQ.answer) {
            feedbackBox.textContent = "Correct!";
            feedbackBox.className = "feedback correct";
            totalScore++;
        } else {
            feedbackBox.textContent = `Incorrect. Correct choice was ${currentQ.answer}.`;
            feedbackBox.className = "feedback incorrect";
        }

        explanationBox.textContent = `Explanation: ${currentQ.rationale}`;
        explanationBox.style.display = 'block';
        checkBtn.style.display = 'none';
        revealBtn.style.display = 'none';
        nextBtn.style.display = 'block';
    });

    revealBtn.addEventListener('click', () => {
        const currentQ = activeQuestions[currentQuestionIndex];
        feedbackBox.textContent = `The requested correct answer is ${currentQ.answer}.`;
        feedbackBox.className = "feedback correct";
        explanationBox.textContent = `Explanation: ${currentQ.rationale}`;
        explanationBox.style.display = 'block';
        checkBtn.style.display = 'none';
        revealBtn.style.display = 'none';
        nextBtn.style.display = 'block';
    });

    nextBtn.addEventListener('click', () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) {
            loadQuestion();
        } else {
            quizView.style.display = 'none';
            scoreView.style.display = 'block';
            finalScoreText.textContent = totalScore;
            finalTotalText.textContent = activeQuestions.length;
        }
    });

    restartBtn.addEventListener('click', () => {
        scoreView.style.display = 'none';
        setupView.style.display = 'block';
    });
</script>

</body>
</html>
