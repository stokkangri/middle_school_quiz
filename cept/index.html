<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Practice Quiz Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Exam Practice Portal</h1>

    <div id="loading-message">Loading chapters layout...</div>

    <div id="setup-view" style="display: none;">
        <div class="dropdown-container">
            <label for="topic-select">Select Practice Topic:</label>
            <select id="topic-select"></select>
        </div>
        <button id="start-btn">Load Quiz Questions</button>
    </div>

    <div id="quiz-view" class="quiz-interface-container" style="display: none;">
        
        <aside class="question-sidebar">
            <h3 class="sidebar-title">Question Grid</h3>
            <div id="question-grid" class="grid-layout">
                </div>
        </aside>

        <main class="quiz-content">
            <div class="progress">Question <span id="current-idx">1</span> of <span id="total-count">0</span></div>
            <div id="question-container">
                <div class="question-text" id="q-text"></div>
                <div class="options" id="q-options"></div>
            </div>

            <div class="feedback" id="feedback-box"></div>
            <div class="explanation" id="explanation-box"></div>

            <div class="action-buttons">
                <button id="prev-btn" class="nav-btn">← Prev</button>
                <button id="check-btn">Check Answer</button>
                <button id="reveal-btn" style="background-color: #64748b;">Reveal Answer</button>
                <button id="next-btn" class="nav-btn">Next →</button>
            </div>
        </main>
    </div>

    <div id="score-view" class="score-view">
        <h2>Topic Run Complete!</h2>
        <p style="font-size: 1.2rem;">Final Score: <strong id="final-score">0</strong> / <strong id="final-total">0</strong></p>
        <button id="restart-btn">Return to Menu</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
