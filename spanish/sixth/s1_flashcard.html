<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compact Spanish Flashcards: Capítulos 1 & 2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f9; display: flex; flex-direction: column; align-items: center; padding: 15px; color: #2c3e50; }
        
        /* Smaller card dimensions to prevent button overlap */
        .card-container { perspective: 1000px; width: 380px; height: 200px; margin: 15px 0; }
        
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .card.is-flipped { transform: rotateY(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; border: 2px solid #34495e; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        
        .front { background-color: #ffffff; }
        .back { background-color: #34495e; color: #ecf0f1; transform: rotateY(180deg); }
        
        .label { font-size: 0.7em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; color: #7f8c8d; }
        .back .label { color: #bdc3c7; }
        
        /* Adjusted font size for smaller card */
        .content { font-size: 1.3em; font-weight: bold; line-height: 1.2; }
        
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; width: 100%; max-width: 400px; }
        .btn { padding: 10px 18px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; background: #34495e; color: white; transition: 0.2s; font-size: 0.9em; }
        .btn:hover { background: #2c3e50; }
        .btn-reveal { background: #e67e22; }
        
        .info { margin-bottom: 5px; font-size: 1em; font-weight: 600; }
        .category { font-style: italic; color: #16a085; font-size: 0.9em; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1><b>Repaso: Capítulos 1 y 2</b></h1>
    <div class="info" id="progress">Card 1 of ...</div>
    <div class="category" id="catDisplay">Category</div>
    
    <div class="card-container" onclick="flipCard()">
        <div class="card" id="mainCard">
            <div class="face front">
                <div class="label">English / Numerical Prompt</div>
                <div class="content" id="frontText">Cargando...</div>
            </div>
            <div class="face back">
                <div class="label">Spanish Answer</div>
                <div class="content" id="backText">...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="changeCard(-1)">Previous</button>
        <button class="btn btn-reveal" onclick="flipCard()">Reveal Answer</button>
        <button class="btn" onclick="changeCard(1)">Next</button>
        <button class="btn" onclick="shuffleDeck()">Shuffle Deck</button>
    </div>

    <script>
        const questionBank = [
            // UNIT 1: GREETINGS, NUMBERS, TIME
            { q: "Good morning", a: "Buenos días", cat: "Saludos" },
            { q: "Glad to meet you!", a: "Mucho gusto", cat: "Cortesía" },
            { q: "See you later", a: "Hasta luego", cat: "Despedidas" },
            { q: "16 (Number)", a: "dieciséis", cat: "Números" },
            { q: "20 (Number)", a: "veinte", cat: "Números" },
            { q: "100 (Number)", a: "cien", cat: "Números" },
            { q: "How are you? (informal)", a: "¿Cómo estás?", cat: "Conversación" },
            { q: "It is one o'clock", a: "Es la una", cat: "La Hora" },
            { q: "It is 4:15", a: "Son las cuatro y cuarto", cat: "La Hora" },
            { q: "It is midnight", a: "Es medianoche", cat: "La Hora" },
            { q: "@ symbol", a: "arroba", cat: "Tecnología" },

            // UNIT 2: SUBJECT PRONOUNS & VERB SER
            { q: "I (Subject Pronoun)", a: "yo", cat: "Pronombres" },
            { q: "You (Informal/Singular)", a: "tú", cat: "Pronombres" },
            { q: "You (Formal/Singular)", a: "usted (Ud.)", cat: "Pronombres" },
            { q: "He / She", a: "él / ella", cat: "Pronombres" },
            { q: "We (Mixed group)", a: "nosotros", cat: "Pronombres" },
            { q: "They (Females only)", a: "ellas", cat: "Pronombres" },
            { q: "I am (Ser)", a: "soy", cat: "Verbo Ser" },
            { q: "You are (Informal/Singular - Ser)", a: "eres", cat: "Verbo Ser" },
            { q: "We are (Ser)", a: "somos", cat: "Verbo Ser" },
            { q: "They are (Ser)", a: "son", cat: "Verbo Ser" },
            { q: "He is from California.", a: "Él es de California.", cat: "Estructura" },
            { q: "Negative: I am not from Arizona.", a: "Yo no soy de Arizona.", cat: "Negación" },

            // UNIT 2: CLASSROOM VOCABULARY
            { q: "The chalk", a: "la tiza", cat: "Salón de Clase" },
            { q: "The girl / The boy", a: "la chica / el chico", cat: "Personas" },
            { q: "The newspaper", a: "el periódico", cat: "Salón de Clase" },
            { q: "The backpack", a: "la mochila", cat: "Salón de Clase" },
            { q: "The notebook", a: "el cuaderno", cat: "Salón de Clase" },
            { q: "The student desk", a: "el pupitre", cat: "Salón de Clase" },
            { q: "The teacher desk", a: "el escritorio", cat: "Salón de Clase" },
            { q: "The wastebasket", a: "el cesto de papeles", cat: "Salón de Clase" },
            { q: "The clock / watch", a: "el reloj", cat: "Salón de Clase" },
            { q: "The board", a: "la pizarra", cat: "Salón de Clase" },
            { q: "How do you say 'chair'?", a: "Se dice silla.", cat: "Conversación" },
            { q: "What does 'mochila' mean?", a: "Quiere decir backpack.", cat: "Conversación" },

            // UNIT 2: CLOTHING, COLORS, AND SUBJECTS
            { q: "The red t-shirt", a: "la camiseta roja", cat: "Ropa/Colores" },
            { q: "The blue jeans", a: "los jeans azules", cat: "Ropa/Colores" },
            { q: "The yellow skirt", a: "la falda amarilla", cat: "Ropa/Colores" },
            { q: "White socks", a: "calcetines blancos", cat: "Ropa/Colores" },
            { q: "Biology", a: "la biología", cat: "Materias" },
            { q: "Computer Science", a: "la computación", cat: "Materias" },
            { q: "Mathematics", a: "las matemáticas", cat: "Materias" },
            { q: "At what time is the class?", a: "¿A qué hora es la clase?", cat: "La Hora" },
            { q: "The classes end at 3:00.", a: "Las clases terminan a las tres.", cat: "Estructura" },

            // UNIT 2: ADJECTIVES, VERBS, AND ESTAR
            { q: "The new students (plural)", a: "los estudiantes nuevos", cat: "Adjetivos" },
            { q: "I speak Spanish.", a: "Hablo español.", cat: "Verbos -AR" },
            { q: "We study (Estudiar)", a: "estudiamos", cat: "Verbos -AR" },
            { q: "They wear / carry", a: "llevan", cat: "Verbos -AR" },
            { q: "The computer mouse", a: "el ratón", cat: "Tecnología" },
            { q: "The laser printer", a: "la impresora láser", cat: "Tecnología" },
            { q: "The keyboard", a: "el teclado", cat: "Tecnología" },
            { q: "I am well. (State of being)", a: "Estoy bien.", cat: "Verbo Estar" },
            { q: "Where is the teacher?", a: "¿Dónde está el profesor?", cat: "Verbo Estar" },
            { q: "We are in class.", a: "Estamos en clase.", cat: "Verbo Estar" },
            { q: "Dot (in a web address)", a: "punto", cat: "Tecnología" }
        ];

        let activeDeck = [...questionBank];
        let currentIdx = 0;

        function shuffleDeck() {
            activeDeck.sort(() => Math.random() - 0.5);
            currentIdx = 0;
            updateUI();
        }

        function flipCard() {
            document.getElementById('mainCard').classList.toggle('is-flipped');
        }

        function changeCard(step) {
            currentIdx += step;
            if (currentIdx < 0) currentIdx = activeDeck.length - 1;
            if (currentIdx >= activeDeck.length) currentIdx = 0;
            updateUI();
        }

        function updateUI() {
            const card = activeDeck[currentIdx];
            const cardEl = document.getElementById('mainCard');
            cardEl.classList.remove('is-flipped');
            
            setTimeout(() => {
                document.getElementById('frontText').innerText = card.q;
                document.getElementById('backText').innerText = card.a;
                document.getElementById('catDisplay').innerText = card.cat;
                document.getElementById('progress').innerText = `Card ${currentIdx + 1} of ${activeDeck.length}`;
            }, 150);
        }

        shuffleDeck();
    </script>
</body>
</html>
